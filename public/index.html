<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 font-sans p-6 text-slate-800">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-extrabold text-blue-600">WhatsApp Scheduler</h1>
            <p class="text-slate-500 mt-1">Schedule your messages completely free.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Status & Form -->
            <div class="space-y-8">
                <!-- Status Card -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <h2 class="text-lg font-bold mb-3 text-slate-700">WhatsApp Connection</h2>
                    <div id="status-badge" class="inline-block px-4 py-2 rounded-full font-semibold bg-yellow-100 text-yellow-800 text-sm">
                        Initializing...
                    </div>
                    <div id="qr-container" class="mt-6 hidden">
                        <p class="text-sm text-slate-500 mb-3 font-medium">Scan this QR code using WhatsApp on your phone (Linked Devices) to connect.</p>
                        <img id="qr-image" src="" alt="QR Code" class="mx-auto border-2 border-slate-100 p-2 rounded-xl shadow-sm w-48 h-48" />
                    </div>
                </div>

                <!-- Schedule Form Card -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-xl font-bold mb-5 text-slate-700">Create New Message</h2>
                    <form id="schedule-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Recipient Phone Number</label>
                            <input type="text" id="phone" placeholder="e.g. 14155552671" required class="block w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                            <p class="text-xs text-slate-400 mt-1">Include country code but NO plus sign (+). E.g. 1 for US.</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Date</label>
                                <input type="date" id="date" required class="block w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Time</label>
                                <input type="time" id="time" required class="block w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Message Body</label>
                            <textarea id="message" rows="4" placeholder="Type your message here..." required class="block w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg transform active:scale-95">
                            Schedule Message
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Task List -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-full flex flex-col">
                <h2 class="text-xl font-bold mb-5 text-slate-700">Scheduled & Sent Messages</h2>
                <div id="task-list" class="space-y-4 overflow-y-auto pr-2 flex-grow">
                    <!-- Tasks will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const statusBadge = document.getElementById('status-badge');
        const qrContainer = document.getElementById('qr-container');
        const qrImage = document.getElementById('qr-image');
        const taskList = document.getElementById('task-list');

        // Handle WebSockets
        socket.on('status', (status) => {
            statusBadge.innerText = status;
            if (status === 'Connected') {
                statusBadge.className = 'inline-block px-4 py-2 rounded-full font-bold bg-green-100 text-green-700 text-sm';
            } else {
                statusBadge.className = 'inline-block px-4 py-2 rounded-full font-bold bg-yellow-100 text-yellow-700 text-sm';
            }
        });

        socket.on('qr', (qrDataURL) => {
            if (qrDataURL) {
                qrImage.src = qrDataURL;
                qrContainer.classList.remove('hidden');
            } else {
                qrContainer.classList.add('hidden');
            }
        });

        // Load tasks
        async function fetchTasks() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="text-center py-10"><p class="text-slate-400 font-medium">No messages scheduled yet.</p></div>';
            }

            // Sort so pending are on top, then by date
            tasks.sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (b.status === 'pending' && a.status !== 'pending') return 1;
                return new Date(a.datetime) - new Date(b.datetime);
            });

            tasks.forEach(task => {
                const dateObj = new Date(task.datetime);
                const isSent = task.status === 'sent';
                const isFailed = task.status === 'failed';
                
                let statusColor = 'bg-blue-100 text-blue-700';
                if (isSent) statusColor = 'bg-green-100 text-green-700';
                if (isFailed) statusColor = 'bg-red-100 text-red-700';
                
                const taskDiv = document.createElement('div');
                taskDiv.className = `p-5 border border-slate-100 rounded-xl transition ${isSent ? 'bg-slate-50 opacity-75' : 'bg-white shadow-sm hover:shadow-md'}`;
                
                taskDiv.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-3">
                            <span class="text-[10px] font-extrabold px-2 py-1 rounded tracking-wider ${statusColor} uppercase">${task.status}</span>
                            <span class="text-sm font-medium text-slate-500">${dateObj.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 transition text-sm font-medium" title="Delete">✕</button>
                    </div>
                    <p class="font-bold text-slate-800 text-sm mb-2 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        +${task.phone}
                    </p>
                    <p class="text-slate-600 text-sm bg-slate-100 p-3 rounded-lg">${task.message.replace(/\n/g, '<br>')}</p>
                `;
                taskList.appendChild(taskDiv);
            });
        }

        // Add task
        document.getElementById('schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dateStr = document.getElementById('date').value;
            const timeStr = document.getElementById('time').value;
            
            // This combines the date and time, and converts it strictly to a UTC string based on the user's exact computer clock
            const localDateTime = new Date(`${dateStr}T${timeStr}`);
            const utcDateTimeStr = localDateTime.toISOString();

            const payload = {
                phone: document.getElementById('phone').value,
                datetime: utcDateTimeStr,
                message: document.getElementById('message').value
            };

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Scheduling...';
            btn.disabled = true;

            await fetch('/api/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('schedule-form').reset();
            btn.innerText = originalText;
            btn.disabled = false;
            fetchTasks();
        });

        // Delete task
        async function deleteTask(id) {
            if(confirm('Are you sure you want to delete this scheduled message?')) {
                await fetch('/api/tasks/' + id, { method: 'DELETE' });
                fetchTasks();
            }
        }

        // Initial load
        fetchTasks();
        // Refresh tasks every 30 seconds
        setInterval(fetchTasks, 30000);
    </script>
</body>
</html>
